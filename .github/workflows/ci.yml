name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Linting, Tests & Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Ruff static analysis
        run: |
          ruff check backend

      - name: Run pytest test suite
        run: |
          pytest backend/tests

      - name: Run pre-deployment configuration validator
        run: |
          python backend/scripts/validate_config.py --env development

  frontend-checks:
    name: Frontend Linting, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          npm ci --prefix frontend

      - name: Run ESLint
        run: |
          npm run lint --prefix frontend

      - name: Run Jest tests
        run: |
          npm test --prefix frontend

      - name: Run Next.js production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          npm run build --prefix frontend
